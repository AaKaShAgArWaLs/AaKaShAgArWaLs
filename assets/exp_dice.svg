<svg xmlns="http://www.w3.org/2000/svg" width="280" height="190" viewBox="0 0 280 190" role="img" aria-labelledby="t d">
<title id="t">Dice Rolling Game</title>
<desc id="d">Dice Rolling Game: An interactive dice simulator with randomization.</desc>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}

.die{transform-box:fill-box;transform-origin:center;animation:tumble 3.6s ease-in-out infinite}
@keyframes tumble{0%,50%,100%{transform:rotate(0) translateY(0)}15%{transform:rotate(-22deg) translateY(-8px)}30%{transform:rotate(16deg) translateY(-3px)}40%{transform:rotate(-6deg)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="280" height="190" rx="14" fill="#1E2730"/><rect x="0" y="16" width="6" height="158" rx="3" fill="#B26BE0"/><g transform="translate(26,38)"><g class="die"><rect width="60" height="60" rx="12" fill="#B26BE0"/><circle cx="15" cy="15" r="5" fill="#11161B"/><circle cx="45" cy="15" r="5" fill="#11161B"/><circle cx="30" cy="30" r="5" fill="#11161B"/><circle cx="15" cy="45" r="5" fill="#11161B"/><circle cx="45" cy="45" r="5" fill="#11161B"/></g></g><text x="92" y="46" font-size="17" fill="#F3F6F9" font-weight="800" text-anchor="start" >Dice Rolling Game</text><text x="92" y="68" font-size="13" fill="#C7D0D9" font-weight="400" text-anchor="start" >An interactive dice</text><text x="92" y="86" font-size="13" fill="#C7D0D9" font-weight="400" text-anchor="start" >simulator with</text><text x="92" y="104" font-size="13" fill="#C7D0D9" font-weight="400" text-anchor="start" >randomization.</text><rect x="20" y="146" width="53" height="26" rx="13" fill="#11161B" stroke="#B26BE0" stroke-width="1.5"/><text x="46.5" y="164" font-size="12" fill="#B26BE0" font-weight="700" text-anchor="middle" >game</text><text x="262" y="164" font-size="12" fill="#8FA0B0" font-weight="600" text-anchor="end" >open repo</text>
</svg>
