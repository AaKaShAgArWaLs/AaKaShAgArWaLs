<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
<title id="t">Aakash Agarwal, full-stack developer</title>
<desc id="d">An order screen: Aakash Agarwal, cycling through full-stack developer, freelance web and app builder, and Resource Lead at Enigma Club, with order tickets sliding along a rail.</desc>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}

.cover{transform:translateX(900px);animation:wipe 1.3s cubic-bezier(.7,0,.2,1) .3s both}
@keyframes wipe{from{transform:translateX(0)}to{transform:translateX(900px)}}
.r{opacity:0;animation:role 12s infinite both}
.r1{opacity:1}
@keyframes role{0%{opacity:0;transform:translateY(10px)}4%{opacity:1;transform:translateY(0)}21%{opacity:1;transform:translateY(0)}25%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
.led{animation:led 2.4s ease-in-out infinite}
@keyframes led{0%,100%{opacity:1}50%{opacity:.25}}
.tk{animation:rail 15s linear infinite}
@keyframes rail{from{transform:translateX(0)}to{transform:translateX(1000px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="880" height="300" fill="#11161B"/>
<rect width="880" height="44" fill="#1A222A"/><text x="24" y="28" font-size="14" fill="#C7D0D9" font-weight="600" text-anchor="start" letter-spacing="0">Order screen 01</text><circle class="led" cx="716" cy="22" r="5" fill="#4CC38A"/><text x="730" y="27" font-size="14" fill="#4CC38A" font-weight="600" text-anchor="start" letter-spacing="0">Open for orders</text><text x="440.0" y="150" font-size="66" fill="#F3F6F9" font-weight="800" text-anchor="middle" letter-spacing="1">Aakash Agarwal</text><rect class="cover" x="0" y="84" width="880" height="90" fill="#11161B"/><g style="animation-delay:1.6s" class="r r1"><text x="440.0" y="204" font-size="22" fill="#F2A93B" font-weight="600" text-anchor="middle" letter-spacing="0">Full-stack developer</text></g><g style="animation-delay:4.6s" class="r r2"><text x="440.0" y="204" font-size="22" fill="#F2A93B" font-weight="600" text-anchor="middle" letter-spacing="0">Freelance web and app builder</text></g><g style="animation-delay:7.6s" class="r r3"><text x="440.0" y="204" font-size="22" fill="#F2A93B" font-weight="600" text-anchor="middle" letter-spacing="0">React, Next.js, FastAPI, React Native</text></g><g style="animation-delay:10.6s" class="r r4"><text x="440.0" y="204" font-size="22" fill="#F2A93B" font-weight="600" text-anchor="middle" letter-spacing="0">Resource Lead at Enigma Club</text></g><rect x="0" y="252" width="880" height="6" fill="#2A343E"/><g class="tk" style="animation-delay:0.0s;animation-duration:15s"><g transform="translate(-120,0)"><rect x="0" y="258" width="46" height="34" rx="3" fill="#8EA2B5"/><rect x="8" y="268" width="30" height="3" fill="#11161B" opacity=".55"/><rect x="8" y="276" width="20" height="3" fill="#11161B" opacity=".55"/></g></g><g class="tk" style="animation-delay:-3.75s;animation-duration:15s"><g transform="translate(-370,0)"><rect x="0" y="258" width="46" height="34" rx="3" fill="#F2A93B"/><rect x="8" y="268" width="30" height="3" fill="#11161B" opacity=".55"/><rect x="8" y="276" width="20" height="3" fill="#11161B" opacity=".55"/></g></g><g class="tk" style="animation-delay:-7.5s;animation-duration:15s"><g transform="translate(-620,0)"><rect x="0" y="258" width="46" height="34" rx="3" fill="#4CC38A"/><rect x="8" y="268" width="30" height="3" fill="#11161B" opacity=".55"/><rect x="8" y="276" width="20" height="3" fill="#11161B" opacity=".55"/></g></g><g class="tk" style="animation-delay:-11.25s;animation-duration:15s"><g transform="translate(-870,0)"><rect x="0" y="258" width="46" height="34" rx="3" fill="#F2A93B"/><rect x="8" y="268" width="30" height="3" fill="#11161B" opacity=".55"/><rect x="8" y="276" width="20" height="3" fill="#11161B" opacity=".55"/></g></g>
</svg>
