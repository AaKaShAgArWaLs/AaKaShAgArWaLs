<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="t d">
<title id="t">Order board</title>
<desc id="d">A kitchen order board with three columns. Stuti Traders and Ganapati Build Mart are ready, MindsTV and an order management API are cooking, and an open ticket for your project moves from new to cooking to ready.</desc>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}

.mv{animation:go 18s cubic-bezier(.65,0,.25,1) infinite}
@keyframes go{
0%{transform:translate(0,0);opacity:0}
4%{transform:translate(0,0);opacity:1}
14%{transform:translate(0,0)}
20%{transform:translate(280px,200px)}
52%{transform:translate(280px,200px)}
58%{transform:translate(560px,200px)}
92%{transform:translate(560px,200px);opacity:1}
97%{transform:translate(560px,200px);opacity:0}
100%{transform:translate(0,0);opacity:0}}
.mvs{animation:col 18s linear infinite}
@keyframes col{0%,14%{fill:#8EA2B5}20%,52%{fill:#F2A93B}58%,100%{fill:#4CC38A}}
.s1{animation:s1 18s linear infinite}.s2{animation:s2 18s linear infinite}.s3{animation:s3 18s linear infinite}
@keyframes s1{0%,16%{opacity:1}18%,100%{opacity:0}}
@keyframes s2{0%,16%{opacity:0}20%,54%{opacity:1}56%,100%{opacity:0}}
@keyframes s3{0%,56%{opacity:0}60%,100%{opacity:1}}
.s2,.s3{opacity:0}
.bar{transform-box:fill-box;transform-origin:left center;animation:fill 6s ease-in-out infinite alternate}
@keyframes fill{from{transform:scaleX(.35)}to{transform:scaleX(.9)}}
.dot{animation:led 2.4s ease-in-out infinite}
@keyframes led{0%,100%{opacity:1}50%{opacity:.3}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
