tter-spacing="0">#04</text><text x="52" y="19" font-size="15" fill="#11161B" font-weight="800" text-anchor="start" letter-spacing="0">Order management API</text><text x="12" y="54" font-size="13" fill="#C7D0D9" font-weight="400" text-anchor="start" letter-spacing="0">Petpooja POS link</text><rect x="12" y="68" width="236" height="6" rx="3" fill="#2A343E"/><rect class="bar" x="12" y="68" width="236" height="6" rx="3" fill="#F2A93B"/></g><g class="" transform="translate(590,76)"><rect width="260" height="88" rx="7" fill="#1E2730"/><rect width="260" height="28" rx="7" fill="#4CC38A" class="strip"/><rect y="14" width="260" height="14" fill="#4CC38A" class="strip"/><text x="12" y="19" font-size="13" fill="#11161B" font-weight="800" text-anchor="start" letter-spacing="0">#01</text><text x="52" y="19" font-size="15" fill="#11161B" font-weight="800" text-anchor="start" letter-spacing="0">Stuti Traders</text><text x="12" y="54" font-size="13" fill="#C7D0D9" font-weight="400" text-anchor="start" letter-spacing="0">Product catalogue</text><text x="12" y="76" font-size="12" fill="#8FA0B0" font-weight="400" text-anchor="start" letter-spacing="0">Next.js and FastAPI</text><polyline points="226,14 233,21 246,7" fill="none" stroke="#11161B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="" transform="translate(590,176)"><rect width="260" height="88" rx="7" fill="#1E2730"/><rect width="260" height="28" rx="7" fill="#4CC38A" class="strip"/><rect y="14" width="260" height="14" fill="#4CC38A" class="strip"/><text x="12" y="19" font-size="13" fill="#11161B" font-weight="800" text-anchor="start" letter-spacing="0">#02</text><text x="52" y="19" font-size="15" fill="#11161B" font-weight="800" text-anchor="start" letter-spacing="0">Ganapati Build Mart</text><text x="12" y="54" font-size="13" fill="#C7D0D9" font-weight="400" text-anchor="start" letter-spacing="0">Hardware supplier site</text><text x="12" y="76" font-size="12" fill="#8FA0B0" font-weight="400" text-anchor="start" letter-spacing="0">gbmart.in</text><polyline points="226,14 233,21 246,7" fill="none" stroke="#11161B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="mv"><g transform="translate(30,76)"><rect width="260" height="88" rx="7" fill="#1E2730" stroke="#8EA2B5" stroke-width="1.5" stroke-dasharray="5 4"/><rect width="260" height="28" rx="7" class="mvs" fill="#8EA2B5"/><rect y="14" width="260" height="14" class="mvs" fill="#8EA2B5"/><text x="12" y="19" font-size="13" fill="#11161B" font-weight="800" text-anchor="start" letter-spacing="0">#next</text><text x="62" y="19" font-size="15" fill="#11161B" font-weight="800" text-anchor="start" letter-spacing="0">Your project</text><g class="s1"><text x="12" y="54" font-size="13" fill="#C7D0D9" font-weight="400" text-anchor="start" letter-spacing="0">Waiting for your idea</text></g><g class="s2"><text x="12" y="54" font-size="13" fill="#C7D0D9" font-weight="400" text-anchor="start" letter-spacing="0">In the kitchen</text></g><g class="s3"><text x="12" y="54" font-size="13" fill="#C7D0D9" font-weight="400" text-anchor="start" letter-spacing="0">Ready to ship</text></g><text x="12" y="76" font-size="12" fill="#8FA0B0" font-weight="400" text-anchor="start" letter-spacing="0">This slot is for you</text></g></g>
